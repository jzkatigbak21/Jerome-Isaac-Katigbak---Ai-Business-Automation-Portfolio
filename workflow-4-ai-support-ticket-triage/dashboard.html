    --good-soft: #e7f4ec;

    --critical-soft: #fbe7e4;

  * { box-sizing: border-box; }

    color: var(--ink);

  /* ---------- Topbar ---------- */

  .topbar {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    padding-bottom: 20px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }

  .brand { display: flex; align-items: center; gap: 12px; }

  .brand svg { flex: none; }

  .brand-text h1 {
    margin: 0;
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-wrap: balance;
  }

  .brand-text p {
    margin: 3px 0 0;
    font-size: 12.5px;
    color: var(--ink-muted);
    font-family: var(--font-mono);
    letter-spacing: 0.03em;
  }

  .stats { display: flex; gap: 26px; }

  .stat { text-align: right; }

  .stat .n {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
  }

  .stat .n.good { color: var(--good); }
  .stat .n.warn { color: var(--warn); }

  .stat .l {
    margin-top: 5px;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  /* ---------- Dataset tabs ---------- */

  .dataset-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 22px;
  }

  .dataset-tab {
    flex: 1;
    min-width: 220px;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 16px;
    cursor: pointer;
    font-family: var(--font-sans);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    transition: border-color 0.12s ease, background 0.12s ease;
  }

  .dataset-tab:hover { border-color: var(--line-strong); }

  .dataset-tab.active {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .dataset-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .dataset-tab .dt-name {
    font-weight: 700;
    font-size: 14px;
  }

  .dataset-tab .dt-sub {
    margin-top: 2px;
    font-size: 11.5px;
    color: var(--ink-muted);
  }

  .live-dot {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--live);
    padding: 3px 7px;
    border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--live) 45%, var(--line));
    flex: none;
  }

  .live-dot::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--live);
  }

  /* ---------- Console layout ---------- */

  .console {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 20px;
    align-items: start;
  }

  @media (max-width: 820px) {
    .console { grid-template-columns: 1fr; }
  }

  /* ---------- Sidebar ---------- */

  .sidebar {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .panel-head {
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--line);
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 10px;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }

  .chip {
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.02em;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: var(--surface-raised);
    color: var(--ink-muted);
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }

  .chip:hover { border-color: var(--accent); color: var(--ink); }

  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .catbars { padding: 12px 16px 14px; border-bottom: 1px solid var(--line); }

  .catrow {
    display: grid;
    grid-template-columns: 68px 1fr 20px;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 11.5px;
  }

  .catrow .k { color: var(--ink-muted); font-family: var(--font-mono); }

  .catrow .bar {
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
  }

  .catrow .bar > span {
    display: block;
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
  }

  .catrow .v {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink-faint);
    text-align: right;
  }

  .ticket-list {
    list-style: none;
    margin: 0;
    padding: 6px;
    max-height: 620px;
    overflow-y: auto;
  }

  .ticket-row {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 10px 10px 10px 12px;
    margin-bottom: 2px;
    cursor: pointer;
    position: relative;
    font-family: var(--font-sans);
    color: var(--ink);
  }

  .ticket-row::before {
    content: "";
    position: absolute;
    left: 0;
    top: 8px;
    bottom: 8px;
    width: 3px;
    border-radius: 2px;
    background: var(--stripe, var(--line-strong));
  }

  .ticket-row:hover { background: var(--surface-raised); }

  .ticket-row.selected {
    background: var(--accent-soft);
    border-color: var(--accent);
  }

  .ticket-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .row-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }

  .row-id {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-muted);
  }

  .row-status {
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 4px;
  }

  .row-status.good { background: var(--good-soft); color: var(--good); }
  .row-status.critical { background: var(--critical-soft); color: var(--critical); }

  .row-customer { font-size: 13.5px; font-weight: 600; margin-top: 4px; }

  .row-text {
    font-size: 12.5px;
    color: var(--ink-muted);
    margin-top: 3px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .row-meta {
    margin-top: 6px;
    display: flex;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--ink-faint);
  }

  /* ---------- Detail pane ---------- */

  .detail {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 22px 26px 26px;
    min-height: 560px;

  .detail-head {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding-bottom: 16px;
    border-bottom: 1px dashed var(--line-strong);
    margin-bottom: 18px;
  }

  .detail-id {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink-faint);
    letter-spacing: 0.03em;
  }

  .detail-customer { font-size: 19px; font-weight: 700; margin-top: 4px; text-wrap: balance; }

  .detail-tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }

  .tag {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 5px;
    border: 1px solid var(--line-strong);
    color: var(--ink-muted);
    background: var(--surface-raised);
  }

  .section { margin-bottom: 20px; }

  .section .eyebrow { margin-bottom: 8px; }

  .incoming {
    background: var(--surface-raised);
    border: 1px solid var(--line);
    border-left: 3px solid var(--line-strong);
    border-radius: 6px;
    padding: 14px 16px;
    font-size: 14.5px;
    line-height: 1.55;
  }

  .incoming.system-note {
    font-style: italic;
    color: var(--ink-muted);
  }

  .readout {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }

  @media (max-width: 560px) { .readout { grid-template-columns: repeat(2, 1fr); } }

  .field .k {
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 5px;
  }

  .field .v {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
  }

  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; position: relative; top: -1px; }
  .dot.low { background: var(--ink-faint); }
  .dot.medium { background: var(--warn); }
  .dot.high { background: var(--critical); }
  .dot.positive { background: var(--good); }
  .dot.neutral { background: var(--ink-faint); }
  .dot.negative { background: var(--critical); }

  .summary-line {
    font-size: 13.5px;
    color: var(--ink-muted);
    line-height: 1.5;
    padding: 12px 0 0;
  }

  .resolution {
    border-radius: 8px;
    padding: 16px 18px;
    border: 1px solid var(--line);
  }

  .resolution.good {
    background: var(--good-soft);
    border-color: color-mix(in srgb, var(--good) 35%, var(--line));
  }

  .resolution.critical {
    background: var(--critical-soft);
    border-color: color-mix(in srgb, var(--critical) 35%, var(--line));
  }

  .resolution-head {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .resolution.good .resolution-head { color: var(--good); }
  .resolution.critical .resolution-head { color: var(--critical); }

  .reply-body {
    font-size: 14.5px;
    line-height: 1.6;
    white-space: pre-line;
    color: var(--ink);
    max-width: 62ch;
  }

  .reply-foot {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed color-mix(in srgb, var(--good) 30%, var(--line));
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-muted);
  }

  .review-reason {
    font-size: 14px;
    line-height: 1.55;
    max-width: 62ch;
    color: var(--ink);
  }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 5px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

  let activeDataset = "synthetic";
  let activeFilter = "all";
  let selectedId = null;

  function currentTickets() {
    return DATASETS[activeDataset].tickets;
  }

  function filteredTickets() {
    const all = currentTickets();
    if (activeFilter === "resolved") return all.filter((t) => t.resolved);
    if (activeFilter === "flagged") return all.filter((t) => !t.resolved);
    return all;
  }

  function renderDatasetBar() {
    const el = document.getElementById("datasetBar");
    el.innerHTML = Object.entries(DATASETS).map(([key, d]) => `
      <button class="dataset-tab ${key === activeDataset ? "active" : ""}" data-dataset="${key}">
        <div>
          <div class="dt-name">${d.label}</div>
          <div class="dt-sub">${d.sub}</div>
        </div>
        ${d.live ? '<span class="live-dot">Live</span>' : ""}
      </button>
    `).join("");

    el.querySelectorAll(".dataset-tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeDataset = btn.dataset.dataset;
        activeFilter = "all";
        selectedId = currentTickets()[0]?.id ?? null;
        renderAll();
      });
    });
  }

  function renderStats() {
    const all = currentTickets();
    const resolved = all.filter((t) => t.resolved).length;
    const flagged = all.length - resolved;
    document.getElementById("stats").innerHTML = `
      <div class="stat"><div class="n">${all.length}/${all.length}</div><div class="l">Processed</div></div>
      <div class="stat"><div class="n good">${resolved}</div><div class="l">Auto-drafted</div></div>
      <div class="stat"><div class="n warn">${flagged}</div><div class="l">Flagged</div></div>
      <div class="stat"><div class="n">0</div><div class="l">Failed</div></div>
    `;
  }

  function renderChips() {
    const all = currentTickets();
    const resolved = all.filter((t) => t.resolved).length;
    const flagged = all.length - resolved;
    const el = document.getElementById("statusChips");
    el.innerHTML = `
      <button class="chip ${activeFilter === "all" ? "active" : ""}" data-filter="all">All · ${all.length}</button>
      <button class="chip ${activeFilter === "resolved" ? "active" : ""}" data-filter="resolved">Auto-drafted · ${resolved}</button>
      <button class="chip ${activeFilter === "flagged" ? "active" : ""}" data-filter="flagged">Flagged · ${flagged}</button>
    `;
    el.querySelectorAll(".chip").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeFilter = btn.dataset.filter;
        renderChips();
        renderList();
      });
    });
  }

  function renderCategoryBars() {
    const all = currentTickets();
    const counts = {};
    all.forEach((t) => { counts[t.category] = (counts[t.category] || 0) + 1; });
    const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    const max = entries[0][1];
    const el = document.getElementById("catBars");
    el.innerHTML = entries.map(([cat, n]) => `
      <div class="catrow">
        <span class="k">${CATEGORY_LABEL[cat] || cat}</span>
        <span class="bar"><span style="width:${(n / max) * 100}%"></span></span>
        <span class="v">${n}</span>
      </div>
    `).join("");
  }

  function renderList() {
    const list = filteredTickets();
    const el = document.getElementById("ticketList");
    if (list.length === 0) {
      el.innerHTML = `<li style="padding:24px 14px;color:var(--ink-faint);font-size:13px;">No tickets in this view.</li>`;
      return;
    }
    el.innerHTML = list.map((t) => {
      const stripe = t.urgency === "high" ? "var(--critical)" : t.urgency === "medium" ? "var(--warn)" : "var(--line-strong)";
      const selected = t.id === selectedId ? "selected" : "";
      const statusClass = t.resolved ? "good" : "critical";
      const statusLabel = t.resolved ? "Drafted" : "Flagged";
      return `
        <li>
          <button class="ticket-row ${selected}" style="--stripe:${stripe}" data-id="${t.id}">
            <div class="row-top">
              <span class="row-id">${t.id}</span>
              <span class="row-status ${statusClass}">${statusLabel}</span>
            </div>
            <div class="row-customer">${t.customer}</div>
            <div class="row-text">${t.text}</div>
            <div class="row-meta">
              <span>${CATEGORY_LABEL[t.category] || t.category}</span>
              <span>·</span>
              <span>${CHANNEL_LABEL[t.channel] || t.channel}</span>
            </div>
          </button>
        </li>
      `;
    }).join("");

    el.querySelectorAll(".ticket-row").forEach((btn) => {
      btn.addEventListener("click", () => {
        selectedId = btn.dataset.id;
        renderList();
        renderDetail();
      });
    });
  }

  function renderDetail() {
    const t = currentTickets().find((x) => x.id === selectedId);
    const el = document.getElementById("detail");
    if (!t) { el.innerHTML = ""; return; }

    const resolutionHtml = t.resolved
      ? `
        <div class="resolution good">
          <div class="resolution-head">✓ Draft reply — ready to send</div>
          <div class="reply-body">${t.draft}</div>
          <div class="reply-foot">Auto-drafted by Claude · confidence ${t.confidence.toFixed(2)} · not sent, awaiting agent send</div>
        </div>
      `
      : `
        <div class="resolution critical">
          <div class="resolution-head">⚑ Flagged for human review</div>
          <div class="review-reason">${t.reviewReason}</div>
        </div>
      `;

    el.innerHTML = `
      <div class="detail-head">
        <div>
          <div class="detail-id">${t.id}${t.order ? " &nbsp;·&nbsp; Order #" + t.order : ""}${t.product ? " &nbsp;·&nbsp; " + t.product : ""}</div>
          <div class="detail-customer">${t.customer}</div>
        </div>
        <div class="detail-tags">
          <span class="tag">${CHANNEL_LABEL[t.channel] || t.channel}</span>
          <span class="tag">${CATEGORY_LABEL[t.category] || t.category}</span>
        </div>
      </div>

      <div class="section">
        <p class="eyebrow">Incoming message</p>
        <div class="incoming ${t.systemNote ? "system-note" : ""}">${t.text}</div>
      </div>

      <div class="section">
        <p class="eyebrow">AI classification</p>
        <div class="readout">
          <div class="field">
            <div class="k">Sentiment</div>
            <div class="v"><span class="dot ${t.sentiment}"></span>${t.sentiment[0].toUpperCase()}${t.sentiment.slice(1)}</div>
          </div>
          <div class="field">
            <div class="k">Urgency</div>
            <div class="v"><span class="dot ${t.urgency}"></span>${t.urgency[0].toUpperCase()}${t.urgency.slice(1)}</div>
          </div>
          <div class="field">
            <div class="k">Category</div>
            <div class="v">${CATEGORY_LABEL[t.category] || t.category}</div>
          </div>
          <div class="field">
            <div class="k">Confidence</div>
            <div class="v">${(t.confidence * 100).toFixed(0)}%</div>
          </div>
        </div>
        <p class="summary-line">${t.summary}</p>
      </div>

      <div class="section">
        <p class="eyebrow">Resolution</p>
        ${resolutionHtml}
      </div>
    `;
  }

  function renderAll() {
    renderDatasetBar();
    renderStats();
    renderChips();
    renderCategoryBars();
    renderList();
    renderDetail();
  }

  selectedId = currentTickets()[0]?.id ?? null;
  renderAll();
</script>
